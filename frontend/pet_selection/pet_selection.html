<!DOCTYPE html>
<html>
<head>
    <title>選擇你的 AI 小寵物</title>
    <link rel="stylesheet" type="text/css" href="pet_selection.css">
</head>
<body>
    <h1>選擇你的 AI 小寵物</h1>
    <div class="pet-options">
        <div class="pet-option">
            <img src="pet_image/Pink Healer.png" alt="療癒粉紅">
            <button data-pet="pink_healer">選擇療癒粉紅</button>
        </div>

        <div class="pet-option">
            <img src="pet_image/Green Sprout.png" alt="自然成長">
            <button data-pet="green_sprout">選擇自然成長</button>
        </div>

        <div class="pet-option">
            <img src="pet_image/Sunny Spark.png" alt="活力陽光">
            <button data-pet="sunny_spark">選擇活力陽光</button>
        </div>
    </div>
    <script src="pet_selection.js"></script>
</body>
</html>
