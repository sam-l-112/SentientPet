<!DOCTYPE html>
<!--
    login.html — 登入 / 註冊頁面
    ============================
    這個頁面同時包含「登入表單」和「註冊表單」兩個區塊。
    預設顯示登入表單，點擊「註冊」連結後會切換成註冊表單，
    兩個表單之間的切換完全由 login.js 用 JS 控制顯示/隱藏，
    不會重新載入頁面。
-->
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- viewport：讓手機版畫面正確縮放，不要自動放大 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
 
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,500;1,400&display=swap"
        rel="stylesheet"
    />
 
    <!-- 全站共用樣式（顏色變數、重置等） -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- 登入頁專屬樣式 -->
    <link rel="stylesheet" href="../css/login.css">
    <!-- 註冊頁專屬樣式 -->
    <link rel="stylesheet" href="../css/register.css">
    <link rel="stylesheet" href="../css/lavaBg.css">
</head>
 
<body class="login-page">

<!-- ════════════════════════════════════════════
     登入表單容器
     預設可見，點「註冊」連結後由 JS 隱藏
     ════════════════════════════════════════════ -->
<div class="login-container">
    <h2>登入</h2>
 
    <form id="loginForm">
 
        <!-- 使用者名稱輸入組 -->
        <div class="input-group">
            <label>使用者名稱</label>
            <input type="text" id="username" required>
        </div>
 
        <!-- 密碼輸入組 -->
        <div class="input-group">
            <label>密碼</label>
            <input type="password" id="password" required>
        </div>
 
        <!-- 登入送出按鈕 -->
        <button type="submit">登入</button>
 
        <p id="error-msg"></p>
    </form>
 
    <!-- 切換到註冊表單的連結區 -->
    <div class="register-link">
        <p>還沒有帳號？ <a href="#" id="showRegister">註冊</a></p>
    </div>
</div>
 
 
<!-- ════════════════════════════════════════════
     註冊表單容器
     預設隱藏（style="display:none"），
     點「註冊」連結後由 JS 切換為可見
     ════════════════════════════════════════════ -->
<div class="register-container" style="display:none;">
    <h2>註冊</h2>
 
    <form id="registerForm">
 
        <!-- 使用者名稱輸入組 -->
        <div class="input-group">
            <label>使用者名稱</label>
            <input type="text" id="registerUsername" required>
        </div>
 
        <!-- 電子郵件輸入組 -->
        <div class="input-group">
            <label>電子郵件</label>
            <input type="text" id="registerEmail" required>
        </div>
 
        <!-- 密碼輸入組 -->
        <div class="input-group">
            <label>密碼</label>
            <input type="password" id="registerPassword" required>
        </div>
 
        <!-- 確認密碼輸入組 -->
        <div class="input-group">
            <label>確認密碼</label>
            <input type="password" id="confirmPassword" required>
        </div>
 
        <!-- 註冊送出按鈕 -->
        <button type="submit">註冊</button>
 
        <p id="register-error-msg"></p>
    </form>
 
    <!-- 切換回登入表單的連結區 -->
    <div class="login-link">
        <p>已經有帳號？ <a href="#" id="showLogin">登入</a></p>
    </div>
</div>
 
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="../js/lavaBg.js"></script>
<script src="../js/login.js"></script>
 
</body>
</html>
